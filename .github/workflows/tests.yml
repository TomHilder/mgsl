name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # NIFTy.re is a local-path test dependency, so CI installs only what the core tests need;
      # the NIFTy.re tests skip themselves without it.
      - name: Test
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest scipy
          python -m pytest -q -p no:warnings
