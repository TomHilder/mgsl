name: release

# Push a tag vX.Y.Z on main to make a GitHub Release (build, release notes from
# docs/changelog.md, sdist and wheel attached). The tests run on pull requests and on main
# (tests.yml), not here. No PyPI upload yet.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # hatch-vcs reads the version from the tag

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install -U build twine
          python -m build
          python -m twine check dist/*

      - name: Check the version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/mgsl-$version-py3-none-any.whl" || { echo "no wheel for $version:"; ls dist; exit 1; }

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' docs/changelog.md > notes.md
          test -s notes.md || { echo "no changelog section for $version"; exit 1; }

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "mgsl $GITHUB_REF_NAME" --notes-file notes.md
