[project]
name = "mgsl"
dynamic = ["version"]
description = "Metric Gaussian Stochastic Localisation in JAX"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Tom Hilder", email = "thilder@flatironinstitute.org" }]
requires-python = ">=3.11"
dependencies = ["jax>=0.7", "numpy>=1.26"]
keywords = [
    "bayesian inference",
    "posterior sampling",
    "stochastic localisation",
    "variational inference",
    "MGVI",
    "JAX",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Documentation = "https://tomhilder.github.io/mgsl/"
Repository = "https://github.com/TomHilder/mgsl"
Issues = "https://github.com/TomHilder/mgsl/issues"
Changelog = "https://tomhilder.github.io/mgsl/changelog/"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/mgsl/py.typed"]
exclude = ["**/__pycache__/**"]

[tool.hatch.build.targets.sdist]
include = ["src/**", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/mgsl"]

[tool.hatch.build.hooks.vcs]
version-file = "src/mgsl/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 99

[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running tests (run with -m slow)",
    "nifty: tests that need NIFTy.re",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]

[tool.uv]
default-groups = ["dev", "examples"]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "nifty>=9.2",
    "scipy>=1.17.1",
]
examples = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "matplotlib-inline>=0.2.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]
