[project]
name = "mgsl"
dynamic = ["version"]
description = "Metric Gaussian Stochastic Localisation in JAX"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Hilder", email = "Thomas.Hilder@monash.edu" }]
requires-python = ">=3.11"
dependencies = ["jax>=0.4.31"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/__pycache__/**"]

[tool.hatch.build.targets.sdist]
include = ["src/**", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/mgsl"]

[tool.hatch.build.hooks.vcs]
version-file = "src/mgsl/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 99

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
